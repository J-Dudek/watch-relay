version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # Délai de carence : une version fraîchement publiée (donc éventuellement compromise) n'est pas proposée.
    cooldown:
      default-days: 7
    groups:
      angular:
        patterns: ['@angular/*', '@angular-devkit/*']
      dev-tools:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
