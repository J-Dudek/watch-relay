name: Dependabot auto-merge
on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  # T2.14 : fusion automatique des mises à jour PATCH de dépendances de DÉVELOPPEMENT, une fois les contrôles
  # requis verts. Sans action tierce (le dépôt n'autorise que les actions GitHub) : le type de mise à jour est
  # déduit du titre de la PR Dependabot (« Bump x from 1.2.3 to 1.2.4 »), la nature de la dépendance de
  # package.json. Les PR groupées et tout titre inattendu ne sont jamais fusionnés automatiquement.
  # Nécessite « Allow auto-merge » et une protection de branche avec contrôles requis (T2.18).
  automerge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fusion automatique des patchs de dépendances de développement
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [[ ! "$PR_TITLE" =~ ^[Bb]ump\ (@?[A-Za-z0-9._/-]+)\ from\ ([0-9]+)\.([0-9]+)\.([0-9]+)\ to\ ([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            echo "Titre non reconnu ou PR groupée : pas d'auto-merge."; exit 0
          fi
          pkg="${BASH_REMATCH[1]}"
          if [[ "${BASH_REMATCH[2]}.${BASH_REMATCH[3]}" != "${BASH_REMATCH[5]}.${BASH_REMATCH[6]}" ]]; then
            echo "Ce n'est pas un patch : pas d'auto-merge."; exit 0
          fi
          # Dépendance de développement dans tous les package.json, et jamais de runtime.
          if jq -r --arg p "$pkg" '[.dependencies[$p]] | any(. != null)' package.json apps/web/package.json packages/engine/package.json | grep -q true; then
            echo "Dépendance d'exécution : pas d'auto-merge."; exit 0
          fi
          if ! jq -r --arg p "$pkg" '[.devDependencies[$p]] | any(. != null)' package.json apps/web/package.json packages/engine/package.json | grep -q true; then
            echo "Dépendance de développement introuvable : pas d'auto-merge."; exit 0
          fi
          gh pr merge --auto --squash "$PR_URL"
