name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # TODO T2.18 : épingler les actions par SHA
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm audit --audit-level=high

  no-claude-signature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Commits
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          git log --format=%B "$base"..HEAD | node scripts/check-no-claude-signature.mjs
      - name: Description de PR
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n%s' "$PR_TITLE" "$PR_BODY" | node scripts/check-no-claude-signature.mjs
