name: Security scans
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '41 3 * * 1'

permissions:
  contents: read

jobs:
  # T2.15 : Semgrep (règles JS/TS + OWASP Top 10). Aucune télémétrie.
  semgrep:
    runs-on: ubuntu-latest
    container: semgrep/semgrep@sha256:67518c174185a2043fdbed16c70631b79209499b3671178e7194379b48295a0d # latest du 2026-11-23
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: >
          semgrep scan --error --metrics=off
          --config p/javascript --config p/typescript --config p/owasp-top-ten
          --exclude node_modules --exclude dist --exclude .angular
          apps packages scripts security

  # T2.19 : OWASP ZAP baseline sur le build de production servi avec les vrais en-têtes.
  # Bloque sur toute alerte non listée dans zap-rules.conf .
  zap-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: PORT=4302 node scripts/serve-dist.mjs apps/web/dist/web/browser &
      - run: mkdir -p zap-out && chmod 777 zap-out && cp zap-rules.conf zap-out/rules.conf
      - run: >
          docker run --rm --network host -v "$PWD/zap-out:/zap/wrk:rw"
          ghcr.io/zaproxy/zaproxy@sha256:9624669db72f54d86c4b46a7064518bd9bf79d8c61a4c31befa9923489f328af
          zap-baseline.py -t http://localhost:4302 -c rules.conf -r zap-report.html -J zap-report.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: zap-report
          path: zap-out
